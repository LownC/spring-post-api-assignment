spring:
  application:
    name: spring-post-api-assignment
  profiles:
    # 아무 프로필도 지정하지 않고 실행하면 dev 프로필로 동작한다.
    active: dev
  jpa:
    # 실행되는 SQL을 콘솔에 출력해서 JPA가 어떤 쿼리를 만드는지 눈으로 확인한다.
    show-sql: true
    hibernate:
      # 엔티티 클래스를 보고 테이블을 자동으로 생성/수정한다. (학습용 설정)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
