spring:
  datasource:
    # 파일 기반 H2 DB. 프로젝트 폴더에 db_dev.mv.db 파일이 생기며, 서버를 껐다 켜도 데이터가 유지된다.
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      # http://localhost:8080/h2-console 에서 DB 내용을 직접 확인할 수 있다.
      enabled: true
      path: /h2-console
